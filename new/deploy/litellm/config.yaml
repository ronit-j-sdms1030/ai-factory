model_list:
  # FreeLLMAPI (MIT, self-hosted `freellmapi` service). Free tiers, testing only.
  # Settings id `freellm/auto` sends model `auto` to its router.
  - model_name: factory-default
    litellm_params:
      model: openai/auto
      api_base: os.environ/FREELLMAPI_BASE_URL
      api_key: os.environ/FREELLMAPI_KEY
  - model_name: freellm/*
    litellm_params:
      model: openai/*
      api_base: os.environ/FREELLMAPI_BASE_URL
      api_key: os.environ/FREELLMAPI_KEY
  # OpenRouter is off for now. To restore, uncomment and set OPENAI_API_KEY.
  # Settings stores OpenRouter ids (openai/..., anthropic/..., qwen/...).
  # - model_name: openai/*
  #   litellm_params:
  #     model: openrouter/openai/*
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: anthropic/*
  #   litellm_params:
  #     model: openrouter/anthropic/*
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: qwen/*
  #   litellm_params:
  #     model: openrouter/qwen/*
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: google/*
  #   litellm_params:
  #     model: openrouter/google/*
  #     api_key: os.environ/OPENAI_API_KEY
  # - model_name: meta-llama/*
