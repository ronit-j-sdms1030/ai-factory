# Dedicated SonarQube instance for the AI Software Factory's code-gen
# security scanning — intentionally separate from any other project's
# SonarQube setup on this machine (own network, own volumes, own port).
services:
  sonar-db:
    image: postgres:15
    container_name: ai-factory-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - ai-factory-sonar-db-data:/var/lib/postgresql/data
    networks:
      - ai-factory-sonarnet

  sonarqube:
    image: sonarqube:community
    container_name: ai-factory-sonarqube
    restart: unless-stopped
    depends_on:
      - sonar-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - ai-factory-sonarqube-data:/opt/sonarqube/data
      - ai-factory-sonarqube-extensions:/opt/sonarqube/extensions
      - ai-factory-sonarqube-logs:/opt/sonarqube/logs
    networks:
      - ai-factory-sonarnet

networks:
  ai-factory-sonarnet:
    name: ai-factory-sonarnet

volumes:
  ai-factory-sonar-db-data:
  ai-factory-sonarqube-data:
  ai-factory-sonarqube-extensions:
  ai-factory-sonarqube-logs:
