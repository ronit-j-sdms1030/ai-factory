<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Stark Digital</title>
<link rel="stylesheet" href="/theme.css">
<script src="/config.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
  .card {
    width: 100%; max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.9rem 1.8rem 2rem;
    box-shadow: var(--shadow);
  }
  .card .brand { margin-bottom: 1.6rem; }
  .card h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 0.3rem; }
  .card p.sub { margin: 0 0 1.5rem; color: var(--text-soft); font-size: 0.88rem; }
  form { display: flex; flex-direction: column; gap: 1rem; }
  .foot-link { margin-top: 1.4rem; text-align: center; font-size: 0.86rem; color: var(--text-soft); }
  .demo-note {
    margin-top: 1.6rem;
    border-top: 1px solid var(--line);
    padding-top: 1rem;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    color: var(--text-faint);
    line-height: 1.7;
  }
  .demo-note strong { color: var(--text-soft); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
        <defs>
          <linearGradient id="brandGrad" x1="2" y1="27" x2="30" y2="5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#e8391f"/>
            <stop offset="100%" stop-color="#ffab3f"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="11" stroke="url(#brandGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="51 100" transform="rotate(-45 16 16)"/>
      </svg>
      <div class="brand-text">
        <strong>Stark Digital</strong>
        <span>Requirement Intake</span>
      </div>
    </div>

    <h1>Internal sign-in</h1>
    <p class="sub">For MD, CEO, VP, PM, and TL accounts.</p>

    <div class="error-banner" id="error-banner"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Work email</label>
        <input type="email" id="email" name="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn" id="submit-btn">Sign in</button>
    </form>

    <p class="foot-link">Signing in as a client? <a href="/client-login.html">Go to client sign-in &rarr;</a></p>

    <div class="demo-note">
      <strong>Demo credentials</strong> (password: password123)<br>
      md@stark.demo &middot; ceo@stark.demo &middot; vp@stark.demo<br>
      pm@stark.demo &middot; tl@stark.demo
    </div>
  </div>

  <script>
    var form = document.getElementById('login-form');
    var errorBanner = document.getElementById('error-banner');
    var submitBtn = document.getElementById('submit-btn');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.add('visible');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBanner.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      fetch(window.API_BASE + '/api/auth/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (!result.ok) throw new Error(result.body.error || 'Sign-in failed');
          window.location.href = '/app.html';
        })
        .catch(function (err) {
          showError(err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        });
    });
  </script>
</body>
</html>
