model_list:
  - model_name: factory-default
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENAI_API_KEY
  # Any OpenRouter id the settings picker sends (openai/..., anthropic/..., etc.).
  - model_name: "*"
    litellm_params:
      model: "*"
      custom_llm_provider: openai
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENAI_API_KEY
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_spend_logs: false
litellm_settings:
  set_verbose: false
  telemetry: false
  drop_params: true
