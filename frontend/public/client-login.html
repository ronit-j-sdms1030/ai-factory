<!doctype html>
<html lang="en" class="theme-client">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client sign-in - Stark Digital</title>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/theme-client.css">
<script src="/config.js"></script>
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
  .wrap {
    width: 100%; max-width: 960px;
    display: grid; grid-template-columns: 1.15fr 1fr; gap: 0;
    border-radius: 20px; overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }

  .hero {
    background:
      radial-gradient(120% 160% at 12% 10%, #ffe3c4 0%, transparent 55%),
      linear-gradient(160deg, #fdf3e7, #fdf3e7 55%, #ffdcb8);
    color: #3a2113;
    padding: 3rem 2.6rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1.3rem;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(65% 90% at 94% 102%, rgba(191, 106, 77, 0.3), transparent 70%);
    pointer-events: none;
  }
  .hero-mark { width: 34px; height: 34px; position: relative; z-index: 1; }
  .hero .kicker { color: #a8543a; display: flex; align-items: center; gap: 0.5rem; position: relative; z-index: 1; }
  .hero .kicker .dot { width: 6px; height: 6px; border-radius: 50%; background: #a8543a; box-shadow: 0 0 0 4px rgba(168, 84, 58, 0.2); }
  .hero h1 {
    font-family: 'Fraunces Client', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 2.7rem;
    line-height: 1.06;
    margin: 0;
    letter-spacing: -0.01em;
    max-width: 11ch;
    position: relative; z-index: 1;
  }
  .hero p { margin: 0; max-width: 32ch; color: #6b4a34; font-size: 1rem; line-height: 1.55; position: relative; z-index: 1; }

  .panel { background: var(--surface); padding: 3rem 2.4rem; display: flex; flex-direction: column; }
  .panel-head { margin-bottom: 1.6rem; }
  .panel-head strong { display: block; font-size: 1.05rem; font-weight: 600; }
  .panel-head span { display: block; font-size: 0.86rem; color: var(--text-soft); margin-top: 0.2rem; }

  .tabs { display: flex; gap: 0.3rem; margin-bottom: 1.7rem; background: var(--surface-2); border-radius: 999px; padding: 0.25rem; }
  .tabs button {
    flex: 1; background: none; border: none; color: var(--text-soft);
    font-weight: 600; font-size: 0.86rem; padding: 0.6rem 0.6rem; border-radius: 999px; cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }
  .tabs button.active { background: var(--accent); color: var(--accent-ink); }

  form { display: flex; flex-direction: column; gap: 1.1rem; }
  form.hidden { display: none; }
  .foot-link { margin-top: 1.6rem; text-align: center; font-size: 0.86rem; color: var(--text-soft); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <svg class="hero-mark" viewBox="0 0 32 32" fill="none">
        <defs>
          <linearGradient id="heroGrad" x1="2" y1="27" x2="30" y2="5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a8543a"/>
            <stop offset="100%" stop-color="#e08a5f"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="11" stroke="url(#heroGrad)" stroke-width="6" stroke-linecap="round" stroke-dasharray="51 100" transform="rotate(-45 16 16)"/>
      </svg>
      <div class="kicker"><span class="dot"></span>Client requirement</div>
      <h1>Turn your ideas into reality.</h1>
      <p>No forms, no ticket queue &mdash; sign in and tell us what you're picturing. We'll take it from there.</p>
    </div>

    <div class="panel">
      <div class="panel-head">
        <strong>Welcome back</strong>
        <span>Sign in to start or continue a requirement.</span>
      </div>

      <div class="tabs">
        <button type="button" id="tab-signin" class="active">Sign in</button>
        <button type="button" id="tab-register">Create account</button>
      </div>

      <div class="error-banner" id="error-banner"></div>

      <form id="signin-form">
        <div class="field">
          <label for="si-email">Email</label>
          <input type="email" id="si-email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="si-password">Password</label>
          <input type="password" id="si-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn" id="signin-btn">Sign in</button>
      </form>

      <form id="register-form" class="hidden">
        <div class="field">
          <label for="reg-name">Name</label>
          <input type="text" id="reg-name" autocomplete="name" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" autocomplete="new-password" minlength="8" required />
        </div>
        <button type="submit" class="btn" id="register-btn">Create account</button>
      </form>

      <p class="foot-link">Part of the internal team? <a href="/login.html">Go to internal sign-in &rarr;</a></p>
    </div>
  </div>

  <script>
    var tabSignin = document.getElementById('tab-signin');
    var tabRegister = document.getElementById('tab-register');
    var signinForm = document.getElementById('signin-form');
    var registerForm = document.getElementById('register-form');
    var errorBanner = document.getElementById('error-banner');

    function showTab(which) {
      errorBanner.classList.remove('visible');
      var isSignin = which === 'signin';
      tabSignin.classList.toggle('active', isSignin);
      tabRegister.classList.toggle('active', !isSignin);
      signinForm.classList.toggle('hidden', !isSignin);
      registerForm.classList.toggle('hidden', isSignin);
    }
    tabSignin.addEventListener('click', function () { showTab('signin'); });
    tabRegister.addEventListener('click', function () { showTab('register'); });

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.add('visible');
    }

    function submitJSON(url, payload, btn, busyLabel, idleLabel) {
      btn.disabled = true;
      btn.textContent = busyLabel;
      return fetch(window.API_BASE + url, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      })
        .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
        .then(function (result) {
          if (!result.ok) throw new Error(result.body.error || 'Something went wrong');
          window.location.href = '/app.html';
        })
        .catch(function (err) {
          showError(err.message);
          btn.disabled = false;
          btn.textContent = idleLabel;
        });
    }

    signinForm.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBanner.classList.remove('visible');
      submitJSON(
        '/api/auth/client/login',
        { email: document.getElementById('si-email').value, password: document.getElementById('si-password').value },
        document.getElementById('signin-btn'), 'Signing in...', 'Sign in'
      );
    });

    registerForm.addEventListener('submit', function (e) {
      e.preventDefault();
      errorBanner.classList.remove('visible');
      submitJSON(
        '/api/auth/client/register',
        {
          name: document.getElementById('reg-name').value,
          email: document.getElementById('reg-email').value,
          password: document.getElementById('reg-password').value,
        },
        document.getElementById('register-btn'), 'Creating account...', 'Create account'
      );
    });
  </script>
</body>
</html>
